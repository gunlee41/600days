<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d1b3a">
<link rel="icon" href="data:,">
<title>600일</title>
<style>
@font-face{font-family:Galmuri11;src:url('Galmuri11.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0a12;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;font-family:Galmuri11,monospace}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#pad{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.btn{position:absolute;display:grid;place-items:center;border-radius:50%;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.32);color:#fff;
  width:58px;height:58px;font-size:19px;padding:0;pointer-events:auto;touch-action:none}
.btn:active,.btn.on{background:rgba(255,255,255,.36)}
#left{left:8px;bottom:8px}
#right{left:72px;bottom:8px}
#jump{right:8px;bottom:8px;width:66px;height:66px;font-size:12px}
#mute{right:6px;top:6px;width:28px;height:28px;border-radius:7px;font-size:12px}
#achbox{position:absolute;left:6px;top:6px;z-index:3;font-size:10px;pointer-events:auto}
#achBtn{font-family:inherit;font-size:10px;color:#ffd97a;background:rgba(20,18,32,.62);
  border:1px solid rgba(255,214,120,.4);border-radius:5px;padding:3px 7px;cursor:pointer}
#achBtn:hover{background:rgba(40,34,60,.85)}
#achList{margin:4px 0 0;padding:5px 8px;list-style:none;background:rgba(12,10,22,.92);
  border:1px solid rgba(255,214,120,.3);border-radius:5px;max-width:214px;
  opacity:0;transform:translateY(-4px);transition:.15s;pointer-events:none}
#achList li{padding:1px 0;color:#6f6a84;font-size:10px;line-height:14px}
#achList li.on{color:#ffe9cf}
#achbox:hover #achList,#achbox.open #achList{opacity:1;transform:none}
#hint{position:absolute;left:0;right:0;bottom:-19px;text-align:center;color:#8d86a8;
  font-size:10px;letter-spacing:.5px;pointer-events:none}
@media (hover:hover) and (pointer:fine){
  #pad{display:none}
  #stage{width:min(96vw,calc(96vh*16/9))}
}
@media (pointer:coarse){
  #hint{display:none}
  #stage{width:100vw}
  #pad{position:fixed;left:0;right:0;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));
    height:96px;display:flex;align-items:center;gap:12px;padding:0 18px}
  #pad .btn{position:static}
  #jump{margin-left:auto;width:78px;height:78px;font-size:13px}
  #mute{position:fixed;top:calc(8px + env(safe-area-inset-top))}
}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="320" height="180"></canvas>
  <div id="pad">
    <button class="btn" id="left" aria-label="left">◀</button>
    <button class="btn" id="right" aria-label="right">▶</button>
    <button class="btn" id="jump" aria-label="jump">JUMP</button>
  </div>
  <button class="btn" id="mute" aria-label="mute">♪</button>
  <div id="achbox">
    <button id="achBtn">업적 <span id="achCount">0/7</span></button>
    <ul id="achList"></ul>
  </div>
  <div id="hint">← → 이동 · Space/↑ 점프 · M 음소거</div>
</div></div>
<script>
(function () {
  var st = document.getElementById('stage');
  function fit() {
    var s = Math.max(1, Math.floor(Math.min(innerWidth / 320, innerHeight / 180)));
    if (matchMedia('(pointer:coarse)').matches) s = Math.min(innerWidth / 320, (innerHeight - 130) / 180);
    st.style.width = (320 * s) + 'px';
    st.style.height = (180 * s) + 'px';
  }
  document.getElementById('achBtn').addEventListener('click', function () {
    document.getElementById('achbox').classList.toggle('open');
  });
  addEventListener('resize', fit);
  addEventListener('orientationchange', function () { setTimeout(fit, 80); });
  fit();
})();
</script>
<script src="logic.js?v=16"></script>
<script src="game.js?v=16"></script>
</body>
</html>
